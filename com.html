<script>
const JUEGO=(function(){
// Juegos de problemas de Distribución · piezas comunes a los 9 tipos (cuentas, fórmulas, números).
// Cada tipo (t_*.js) define TIPO con sus problemas, su dibujo y su tema; motor.js lo juega.

const LUGARES = ['Taller de Tremañes','Nave de Porceyo','Astillero de El Musel','Sidrería de Villaviciosa','Carpintería de Llanera','Taller de La Calzada',
 'Panadería de La Pola','Fábrica de Lugones','Serrería de Grado','Taller de Mieres','Lagar de Nava','Quesería de Cabrales','Conservera de Candás',
 'Taller de Luanco','Lonja de Cudillero','Granja de Siero','Imprenta de Oviedo','Lavandería de Avilés','Talleres de Langreo','Bodega de Cangas',
 'Garaje de Roces','Cocina de Cimadevilla','Nave de Tabaza','Taller de Infiesto'];
const MAQ = [['Una amasadora','a'],['Un torno','o'],['Una lavadora industrial','a'],['Una sierra de cinta','a'],['Un compresor','o'],['Una bomba de agua','a'],
 ['Una prensa','a'],['Un taladro de columna','o'],['Una cámara frigorífica','a'],['Una esmeriladora','a']];

function es(x, d = 2) {
  const neg = x < 0; const a = Math.abs(x);
  let s = (Math.round((a + 1e-9) * 10 ** d) / 10 ** d).toFixed(d);
  if (d > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  let [e, f] = s.split('.');
  e = e.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg && +s !== 0 ? '−' : '') + e + (f ? ',' + f : '');
}
function rnd(a, b, step = 1) { const n = Math.round((b - a) / step); return +(a + Math.floor(Math.random() * (n + 1)) * step).toFixed(6); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
const om = x => es(x, 0) + ' Ω';
const MA = {mA:1000};
const U_R = ['Ω', 'V', 'A'], U_I = ['A', 'mA', 'V'], U_V = ['V', 'A', 'Ω'];
const SIN = 'sin unidad';

function calc(k, f, nums, val, dec, unit, units, opt = {}) {
  return Object.assign({k, lhs:k, f: f.split(' '), nums, val, dec, unit, units, alts: [], mal: [], extra: [], trap: [], esq:1}, opt);
}
// Pregunta con opciones. malas = [[texto, por qué está mal], ...]; res = lo que se apunta en el papel.
function elige(k, q, ok, malas, ex, res, esq = 1) { return {k, lhs:k, elige:true, q, ok, malas:malas.map(m => m[0]), por:Object.fromEntries(malas), ex, res, esq, pide:true}; }
function tok(v, n) { return {v, n}; }
function dd(sym, val, t) { return {sym, val, tok: t, k: sym}; }             // dato que se toca en el enunciado
function dc(sym, val, q, opts) { return {sym, val, q, opts, k: sym}; }      // dato que se elige (cambio de unidad, n.º de clase...)

// Solo admite el redondeo (0,15 %): así los errores típicos no cuelan como buenos.
// tol: algunas cuentas encadenadas (S = U · I con I redondeada) admiten algo más.
function acierta(x, val, tol = 0.0015) { return Math.abs(x - val) <= Math.max(Math.abs(val) * tol, 1e-9); }
// Al azar se descartan los casos en que un error típico da casi lo mismo que lo bueno.
// (Si el error da exactamente lo mismo, como Q2 = 0 con cos φ2 = 1, no se puede notar: no cuenta.)

// Fórmulas: dos son la misma si dan lo mismo con cualquier valor (vale cualquier orden correcto de las fichas).
const GR = Math.PI / 180;
const FUN = {arccos:x => Math.acos(x) / GR, arctg:x => Math.atan(x) / GR, tg:x => Math.tan(x * GR), sen:x => Math.sin(x * GR), '√':Math.sqrt};
function evalua(fichas, vals) {
  let i = 0; const t = fichas;
  const atom = () => { const k = t[i++];
    if (k === undefined) throw 0;
    if (k === '(') { const v = suma(); if (t[i++] !== ')') throw 0; return v; }
    if (FUN[k]) return FUN[k](atom());
    if (k === 'π') return Math.PI;
    if (k === ')' || ['+','−','·','/'].includes(k)) throw 0;
    if (/^[\d.,]+$/.test(k)) return parseFloat(k.replace(/\./g,'').replace(',','.'));
    if (vals[k] === undefined) { let h = 7; for (const c of k) h = (h * 31 + c.charCodeAt(0)) % 9973; vals[k] = 0.05 + ((h * vals.$) % 997) / 1100; }
    return vals[k]; };
  const prod = () => { let v = atom(); while (['·','/'].includes(t[i])) { const o = t[i++], w = atom(); v = o === '/' ? v / w : v * w; } return v; };

}

  try { return [3, 11, 29].every(k => { const m = {$:k}, x = evalua(a, m), y = evalua(b, m); return isFinite(x) && Math.abs(x - y) <= 1e-9 * Math.max(1, Math.abs(x)); }); } catch (e) { return false; }
}
function leeNum(s) {

  else if (/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return s.match(/^-?\d*\.?\d+$/) ? parseFloat(s) : NaN;

const U_ANG = ['°', 'var', 'rad/s'], U_VAR = ['var', 'VA', 'W'], U_W = ['rad/s', 'Hz', 's'], U_C = ['µF', 'F', 'mF'];
const CONEXION = elige('Conexión', '¿Cómo se conecta el condensador?', 'En paralelo con la carga',

function compensa(p) {

    datos:[dd('U', U + ' V', 'U'), dd('f', f + ' Hz', 'f'), dc('P', es(P, 0) + ' W', `P = ${es(PkW)} kW. Las Q salen en var si P va en vatios. ¿Cuántos W son? (× 1000)`, [es(P, 0) + ' W', es(PkW) + ' W', es(P / 10, 0) + ' W']),

        trap:[[P * Math.sin(f2 * GR), 'Con sen no: Q = P · tg φ.'], [Q1, 'Esa es Q1. Q2 va con φ2, el que quiero.'], [PkW * Math.tan(f2 * GR), 'Has usado P en kW. En vatios salen var.']]}),
      calc('Qc', 'Q1 − Q2', `${es(Q1)} − ${es(Q2)}`, Qc, 2, 'var', U_VAR, {pide:true, mal:['Qc = Q1 + Q2', 'Qc = Q2 − Q1'], extra:['P', '·', 'tg'],

  if (isNaN(x)) { J.msg = 'Escribe un número, por ejemplo 0,4492.'; J.msgOk = false; return parte(); }
  const okA = acierta(x, c.val, c.tol), okM = c.alt && Object.values(c.alt).some(m => acierta(x, c.val * m, c.tol));
  if ((okA || okM) && !J.unit) { J.msg = 'El número está bien. Ahora toca la unidad.'; J.msgOk = true; return parte(); }
  if (J.unit && acierta(x, valEn(c, J.unit), c.tol) && (J.unit === c.unit || (c.alt && c.alt[J.unit]))) { SND.ok(); return sigCalc(j, c.exOk || '', true); }
  if (okA || okM) { SND.bad(); tropiezo(); J.msg = `El número está bien, pero la unidad no es ${J.unit}.${okM && J.unit === c.unit ? ' Ese número está en otra unidad: ' + Object.keys(c.alt).join(' o ') + '.' : okA ? ' Ese número está en ' + c.unit + '.' : ''}`; J.msgOk = false; return parte(); }
  SND.bad(); tropiezo(); J.re++;
  const tr = c.trap.find(([v]) => !acierta(v, c.val) && (acierta(x, v) || (c.alt && Object.values(c.alt).some(m => acierta(x, v * m)))));
  const casi = [c.val, ...Object.values(c.alt || {}).map(m => c.val * m)].some(v => Math.abs(x - v) <= Math.abs(v) * 0.012);
  J.msg = tr ? tr[1] : casi ? 'Casi. Has redondeado demasiado: escribe más decimales (o pásalo a mA).' : 'No sale. Repite la cuenta despacio.'; J.msgOk = false;
  if (J.re >= 3) return sigCalc(j, `El resultado es ${es(c.val, c.dec)} ${ud(c)}. Mira cómo sale en tu papel y lo repites luego.`, false);
  parte();
}
function finSesion() {
  const n = J.list.length, ratio = J.err / n, st = ratio <= .5 ? 3 : ratio <= 2 ? 2 : 1;
  if (J.id) guarda(J.id, st); SND.win();
  const forms = [];
  J.list.forEach(j => j.calc.forEach(c => { if (c.elige) return; const f = fTxt(c); if (!forms.includes(f)) forms.push(f); }));
  pinta(`${barra(J.titulo)}<article class="r-parte r-fin"><div class="r-star" aria-label="${st} estrellas de 3">${estrellas(st)}</div><h2>Jornada terminada</h2>
    <p>${n} ${n === 1 ? 'problema' : 'problemas'}. ${J.err ? `${J.err} ${J.err === 1 ? 'tropiezo' : 'tropiezos'} por el camino.` : 'Ni un tropiezo.'}</p>
    <div class="r-take"><div class="r-et">Lo que te llevas</div>${forms.slice(0, 14).map(f => `<div>${fs(f)}</div>`).join('')}</div>
    <div class="r-row" style="justify-content:center"><button type="button" class="r-b pri big" data-a="menu">Volver al menú</button></div></article>`);
}

// ---------- zonas ----------
function zona(m) {
  if (m === 'c' || m === 'd') return sesion(TIPO.clase.map(f => f()), m === 'c' ? 1 : 3, `${TIPO.n} · Los de clase`, m);
  const subs = TIPO.orden;
  const l = m === '1' ? subs.map(s => hacer(s)) : m === '2' ? shuffle(subs).map(s => hacer(s)) : Array.from({length:3}, () => hacer(pick(subs)));
  sesion(l, +m, `${TIPO.n} · ${m === '1' ? 'Aprendiz' : m === '2' ? 'Oficial' : 'Jefe de obra'}`, m);
}
function repaso() {
  const orden = Object.entries(S.fails).sort((a, b) => b[1] - a[1]).map(x => x[0]).filter(s => TIPO.subs[s]);
  if (!orden.length) return inicio();
  const l = []; for (let i = 0; i < 3; i++) l.push(hacer(orden[i % orden.length]));
  sesion(l, 2, 'Repaso de fallos', null, {repaso:true});
}

const textoPlano = (s, j) => fs(s.replace(/\{(\w+)\}/g, (_, k) => j.toks[k].v));
// ---------- examen ----------
let E = null;
const pideE = j => j.calc.filter(c => c.pide && !c.elige && c.k !== 'comp');
function examen() {
  const l = [...shuffle(TIPO.clase).slice(0, 2).map(f => f()), hacer(pick(TIPO.orden)), hacer(pick(TIPO.orden))];
  E = {l:shuffle(l), i:0, res:[]}; E.l.forEach(j => j.obra = lugarObra()); rondaE(); }
function rondaE() {
  const j = E.l[E.i]; if (!j) return finE();
  const pide = pideE(j);
  pinta(`${barra('Examen', pips(E.l.length, E.i))}<article class="r-parte"><div class="r-cab">${orgTag(j)}</div><div class="r-et">El caso</div><div class="r-caso">${textoPlano(j.txt, j)}</div><div class="r-et" style="margin-top:10px">Pregunta</div><div class="r-preg" style="margin-top:0">${fs(j.preg)}</div>
    <div class="r-et" style="margin-top:12px">Hazlo en tu papel y escribe los resultados</div>
    ${pide.map((c, k) => `<div class="r-res"><label for="ex${k}">${fs(c.lhs)} =</label><input id="ex${k}" inputmode="decimal" autocomplete="off" value="${(E.val && E.val[k]) || ''}"><span class="r-us">${c.units.slice().sort().map(u => `<button type="button" class="r-u ${(E.un && E.un[k]) === u ? 'on' : ''}" data-eu="${k}|${u}">${u}</button>`).join('')}</span></div>`).join('')}
    ${E.msg ? `<div class="r-msg ko" style="margin-top:8px">${E.msg}</div>` : ''}<div class="r-row"><button type="button" class="r-b pri big" data-a="e:ok">Entregar este</button></div></article>`);
}
function leeE() { E.val = $$('[id^=ex]').map(i => i.value); }
function clicE(a, el) {
  if (el.dataset.eu) { leeE(); const [k, u] = el.dataset.eu.split('|'); E.un = E.un || {}; E.un[k] = u; return rondaE(); }
  if (a === 'e:ok') { leeE(); const j = E.l[E.i], pide = pideE(j);
    if (pide.some((c, k) => isNaN(leeNum(E.val[k])) || !(E.un && E.un[k]))) { E.msg = 'Falta algo: escribe cada número y su unidad.'; return rondaE(); }
    const bienK = pide.map((c, k) => (E.un[k] === c.unit || (c.alt && c.alt[E.un[k]])) && acierta(leeNum(E.val[k]), valEn(c, E.un[k]), c.tol));
    E.res.push({j, bien:bienK.filter(Boolean).length / pide.length, puso:pide.map((c, k) => `${bienK[k] ? '✔' : '✘'} ${fs(c.lhs)} = ${E.val[k]} ${E.un[k]}`).join('<br>')});
    if (bienK.every(Boolean)) { S.lit[j.obra] = 1; S.jobs++; } else S.fails[j.sub] = (S.fails[j.sub] || 0) + 1;
    save(); SND.clic(); E.i++; E.val = null; E.un = null; E.msg = ''; rondaE(); }
}
function finE() {
  const n = E.res.length, ok = E.res.reduce((a, r) => a + r.bien, 0), nota = ok / n * 10;
  S.ex.push({nota, n, d:Date.now()}); save(); SND.win();
  const sol = r => r.j.calc.filter(c => !c.elige).map(c => `${fs(fTxt(c))} = <b>${es(c.val, c.dec)} ${ud(c)}</b>`).join('<br>');
  pinta(`${barra('Examen')}<article class="r-parte"><div class="r-fin"><h2>Nota: ${es(nota, 1)}</h2><p>Cada problema vale lo mismo. Cada resultado bien suma su parte.</p></div>
   <div class="r-tw"><table class="r-t"><tr><th>Problema</th><th>Pusiste</th><th>Cómo sale</th></tr>${E.res.map(r => `<tr style="background:${r.bien === 1 ? '#eef9f0' : r.bien ? '#fff8e5' : '#fdeeed'}"><td>${textoPlano(r.j.txt, r.j)}</td><td>${r.puso}</td><td>${sol(r)}</td></tr>`).join('')}</table></div>
   <div class="r-row" style="justify-content:center"><button type="button" class="r-b pri big" data-a="menu">Volver al menú</button></div></article>`);
}

// ---------- panel de V ----------
const NOMSUB = TIPO.nomsub;
function informe() {
  const f = Object.entries(S.fails).sort((a, b) => b[1] - a[1]).map(([s, n]) => `${NOMSUB[s] || s}: ${n}`).join(', ') || 'ninguno';
  const st = Object.entries(S.st).map(([k, v]) => `${k}=${v}`).join(', ') || 'nada';
  const ex = S.ex.slice(-5).map(e => es(e.nota, 1)).join(', ') || 'ninguno';
  return `${TIPO.n} (Distribución, juego ${TIPO.num}) · informe\nProblemas hechos: ${S.jobs}. Talleres con luz: ${Object.keys(S.lit).length}/${LUGARES.length}.\nFallos por problema: ${f}\nEstrellas: ${st}\nExámenes: ${ex}`;
}
function panel() {
  const fal = Object.entries(S.fails).sort((a, b) => b[1] - a[1]);
  pinta(`${barra('Panel de V')}<article class="r-parte"><h2 style="font-size:32px">Cómo va M</h2><p>${S.jobs} problemas hechos, ${S.ex.length} exámenes${S.ex.length ? ` (última nota ${es(S.ex[S.ex.length - 1].nota, 1)})` : ''}.</p>
   <div class="r-tw"><table class="r-t"><tr><th>Problema que más falla</th><th>Fallos</th></tr>${fal.length ? fal.map(([s, n]) => `<tr><td>${NOMSUB[s] || s}</td><td>${n}</td></tr>`).join('') : '<tr><td colspan="2">Sin fallos guardados</td></tr>'}</table></div>
   <p class="r-ayuda">Los resultados aceptan un pequeño redondeo. Las corrientes valen en A o en mA. «Los de clase» son los enunciados tal cual (controles de César y ejercicios de clase), con M = n.º 2.</p>
   <div class="r-row"><button type="button" class="r-b pri" data-a="p:copia">Copiar informe para Claude</button><button type="button" class="r-b" data-a="p:reset">${RT.dataset.borrar ? 'Pulsa otra vez para borrar' : 'Borrar el progreso'}</button></div><div id="rcopia"></div></article>`);
}
function clicP(a) {
  if (a === 'p:copia') { const t = informe(); const ok = () => toast('Informe copiado'); const no = () => { $('#rcopia').innerHTML = `<textarea class="r-copia" readonly>${t}</textarea>`; $('#rcopia textarea').select(); };
    try { navigator.clipboard.writeText(t).then(ok, no); } catch (e) { no(); } }
  if (a === 'p:reset') { if (RT.dataset.borrar) { delete RT.dataset.borrar; S = Object.assign(fresh(), {mute:S.mute}); save(); inicio(); } else { RT.dataset.borrar = '1'; panel(); } }
}

// ---------- reparto de clics ----------
function onClick(e) {
  const el = e.target.closest('button'); if (!el || el.disabled) return;
  const a = el.dataset.a || '';
  if (a === 'mute') { S.mute = !S.mute; save(); el.textContent = S.mute ? '🔇' : '🔊'; return; }
  if (a !== 'p:reset') delete RT.dataset.borrar;
  if (a === 'menu') { J = null; return inicio(); }
  if (a === 'panel') return panel();
  if (a === 'repaso') return repaso();
  if (a === 'examen') return examen();
  if (a.startsWith('z:')) return zona(a.slice(2));
  if (a.startsWith('e:') || el.dataset.eu) return clicE(a, el);
  if (a.startsWith('p:')) return clicP(a);
  if (J) return clicParte(a, el);
}
function abrir(root) {
  RT = root; RT.classList.add('rs');
  try { const t = localStorage.getItem(KEY); if (t) S = Object.assign(fresh(), JSON.parse(t)); } catch (e) {}
  if (!RT.dataset.on) { RT.dataset.on = '1'; RT.addEventListener('click', onClick); RT.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'rval') { e.preventDefault(); compRes(J.list[J.i]); } }); }
  inicio();
}
return {abrir, _j:() => J, _s:() => S, _prueba:(sub, modo) => sesion([hacer(sub)], modo, 'Prueba', null)};

})();
JUEGO.abrir(document.getElementById('ruta'));
</script>
