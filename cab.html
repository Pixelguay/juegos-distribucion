.rs{--ink:#16202b;--ink2:#46535f;--cell:#23272e;--cell2:#323844;--bus:rgba(201,128,64,.22);--paper:#fff;--paper2:#f3f5f7;--line:#c9d2db;--sun:#ffc21a;--sun2:#d9730d;--good:#1b7f3b;--goodbg:#dff4e4;--bad:#b3261e;--badbg:#fde8e6;--ayuda:#1d3f7a;--tie:#1f7a4a;--sol:#c75f06;--pan:#1763a8;--hoj:#6b3fa0;

/* Ruta de la Corriente: pestañas de esquemas, aviso de esquema, talleres */

<script>
const JUEGO=(function(){
// Juegos de problemas de Distribución · piezas comunes a los 9 tipos (cuentas, fórmulas, números).
// Cada tipo (t_*.js) define TIPO con sus problemas, su dibujo y su tema; motor.js lo juega.

const LUGARES = ['Taller de Tremañes','Nave de Porceyo','Astillero de El Musel','Sidrería de Villaviciosa','Carpintería de Llanera','Taller de La Calzada',
 'Panadería de La Pola','Fábrica de Lugones','Serrería de Grado','Taller de Mieres','Lagar de Nava','Quesería de Cabrales','Conservera de Candás',
 'Taller de Luanco','Lonja de Cudillero','Granja de Siero','Imprenta de Oviedo','Lavandería de Avilés','Talleres de Langreo','Bodega de Cangas',
 'Garaje de Roces','Cocina de Cimadevilla','Nave de Tabaza','Taller de Infiesto'];
const MAQ = [['Una amasadora','a'],['Un torno','o'],['Una lavadora industrial','a'],['Una sierra de cinta','a'],['Un compresor','o'],['Una bomba de agua','a'],
 ['Una prensa','a'],['Un taladro de columna','o'],['Una cámara frigorífica','a'],['Una esmeriladora','a']];

function es(x, d = 2) {
  const neg = x < 0; const a = Math.abs(x);
  let s = (Math.round((a + 1e-9) * 10 ** d) / 10 ** d).toFixed(d);
  if (d > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  let [e, f] = s.split('.');
  e = e.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg && +s !== 0 ? '−' : '') + e + (f ? ',' + f : '');
}
function rnd(a, b, step = 1) { const n = Math.round((b - a) / step); return +(a + Math.floor(Math.random() * (n + 1)) * step).toFixed(6); }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
const om = x => es(x, 0) + ' Ω';
const MA = {mA:1000};
const U_R = ['Ω', 'V', 'A'], U_I = ['A', 'mA', 'V'], U_V = ['V', 'A', 'Ω'];
const SIN = 'sin unidad';

function calc(k, f, nums, val, dec, unit, units, opt = {}) {
  return Object.assign({k, lhs:k, f: f.split(' '), nums, val, dec, unit, units, alts: [], mal: [], extra: [], trap: [], esq:1}, opt);
}
// Pregunta con opciones. malas = [[texto, por qué está mal], ...]; res = lo que se apunta en el papel.
function elige(k, q, ok, malas, ex, res, esq = 1) { return {k, lhs:k, elige:true, q, ok, malas:malas.map(m => m[0]), por:Object.fromEntries(malas), ex, res, esq, pide:true}; }
function tok(v, n) { return {v, n}; }
function dd(sym, val, t) { return {sym, val, tok: t, k: sym}; }             // dato que se toca en el enunciado
function dc(sym, val, q, opts) { return {sym, val, q, opts, k: sym}; }      // dato que se elige (cambio de unidad, n.º de clase...)

// Solo admite el redondeo (0,15 %): así los errores típicos no cuelan como buenos.
// tol: algunas cuentas encadenadas (S = U · I con I redondeada) admiten algo más.
function acierta(x, val, tol = 0.0015) { return Math.abs(x - val) <= Math.max(Math.abs(val) * tol, 1e-9); }

const choca = j => j.calc.some(c => !c.elige && c.trap.some(([v]) => Math.abs(v - c.val) > 1e-9 && acierta(v, c.val, c.tol)));

function deClase(id, de, sub, p, txt, preg, ajusta) {

// Fórmulas: dos son la misma si dan lo mismo con cualquier valor (vale cualquier orden correcto de las fichas).
const GR = Math.PI / 180;
const FUN = {arccos:x => Math.acos(x) / GR, arctg:x => Math.atan(x) / GR, tg:x => Math.tan(x * GR), sen:x => Math.sin(x * GR), '√':Math.sqrt};
function evalua(fichas, vals) {
  let i = 0; const t = fichas;
  const atom = () => { const k = t[i++];
    if (k === undefined) throw 0;
    if (k === '(') { const v = suma(); if (t[i++] !== ')') throw 0; return v; }
    if (FUN[k]) return FUN[k](atom());
    if (k === 'π') return Math.PI;
    if (k === ')' || ['+','−','·','/'].includes(k)) throw 0;
    if (/^[\d.,]+$/.test(k)) return parseFloat(k.replace(/\./g,'').replace(',','.'));
    if (vals[k] === undefined) { let h = 7; for (const c of k) h = (h * 31 + c.charCodeAt(0)) % 9973; vals[k] = 0.05 + ((h * vals.$) % 997) / 1100; }

}

}

}

// Letras como en el papel: RL → R con L pequeña; algunas con nombre propio.
const NOMS_BASE = {Rtotal:'R total', Itotal:'I total', Vfinal:'V final', Vmin:'V mínima', Padd:'P añadida', Rmax:'R<sub>máx</sub>', Rcom:'S comercial',
  cosφ:'cos φ', cosφ1:'cos φ<sub>1</sub>', cosφ2:'cos φ<sub>2</sub>', 'U²':'U²', Vmed:'V medida', pct:'%', Rbs:'R<sub>botas + suelo</sub>', llega:'% que llega', caida:'caída %'};

function fs(t) {
  if (!_RX) { const ks = [...Object.keys(NOMS_BASE), ...SUB_BASE].sort((a, b) => b.length - a.length).map(k => k.replace(/[²]/g, '\\$&'));
    _RX = new RegExp(`(?<![A-Za-zÁÉÍÓÚáéíóúñ{φ])(${ks.join('|')})(?![A-Za-zÁÉÍÓÚáéíóúñ0-9²])`, 'g'); }
  return String(t).replace(/\( /g, '(').replace(/ \)/g, ')').replace(_RX, m => NOMS_BASE[m] ?? `${m[0]}<sub>${m.slice(1)}</sub>`);
}
const ud = c => c.unit === SIN ? '' : c.unit;

// Piezas de dibujo comunes. Cada tipo dibuja su esquema n (1, 2 o 3) con ellas.
// V = valores ya conocidos (clave → texto); hl = la pieza que toca ahora (se pinta en amarillo).
const C_TXT = '#16202b', C_GRI = '#7a8794', C_HL = '#d9730d', C_W = '#16202b', C_I = '#1d3f7a';
// Las letras del dibujo, como en el papel (mismas reglas que fs).
const svgT = s => fs(s).replace(/<sub>(.*?)<\/sub>/g, '<tspan baseline-shift="sub" font-size="72%">$1</tspan>');
const lab = k => svgT(k);
const largo = k => fs(k).replace(/<[^>]+>/g, '').length;
const _svg = (w, h, inner, t) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${t}" font-family="Atkinson Hyperlegible, Verdana, sans-serif">${inner}</svg>`;

function rH(x, y, k, V, hl, cap) {

   <text x="${x}" y="${y - 17}" text-anchor="middle" font-size="19" font-weight="700" fill="${C_TXT}">${lab(k)}</text>
   <text x="${x}" y="${y + 29}" text-anchor="middle" font-size="17" font-weight="${v ? 700 : 400}" fill="${v ? C_TXT : C_GRI}">${v || '?'}</text>${_cap(x, y + 44, cap)}`;

function rV(x, y, k, V, hl, cap, h = 50) {

function tag(x, y, k, V, hl, a = 'middle') {

const flecha = (x, y, dir) => { const d = {u:`M${x - 6} ${y + 5} L${x} ${y - 6} L${x + 6} ${y + 5}Z`, d:`M${x - 6} ${y - 5} L${x} ${y + 6} L${x + 6} ${y - 5}Z`, r:`M${x - 5} ${y - 6} L${x + 6} ${y} L${x - 5} ${y + 6}Z`, l:`M${x + 5} ${y - 6} L${x - 6} ${y} L${x + 5} ${y + 6}Z`}[dir]; return `<path d="${d}" fill="${C_I}"/>`; };

// Tipo «Conductor eléctrico» (juego 10): el DNI del cable, la intensidad máxima de la tabla, la teoría del cuaderno y los factores de la sección.
// Fuentes: cuaderno de M (fotos del 2-11-2026), ejercicios 16-24 de «Examen conductor eléctrico» (gen.py) y controles 31-34 de César.
// Tabla A.52-1 bis de la UNE 20460-5-523 (40 °C, aire, cobre): grapada en la pared = método C; columnas 6 (3 PVC), 8 (2 PVC), 9 (3 XLPE), 11 (2 XLPE).
const AMP = {1.5:[11, 11.5, 13, 13.5, 15, 16, 16.5, 19, 20, 21, 24], 2.5:[15, 16, 17.5, 18.5, 21, 22, 23, 26, 26.5, 29, 33], 4:[20, 21, 23, 24, 27, 30, 31, 34, 36, 38, 45],
  6:[25, 27, 30, 32, 36, 37, 40, 44, 46, 49, 57], 10:[34, 37, 40, 44, 50, 52, 54, 60, 65, 68, 76], 16:[45, 49, 54, 59, 66, 70, 73, 81, 87, 91, 105]};

// ---------- el DNI del cable ----------
const SIG = {H:'Armonizado (norma europea)', ES:'Cable nacional', '05':'Tensión 300/500 V', '07':'Tensión 450/750 V', 'V·a':'Aislamiento de PVC', 'Z1·a':'Aislamiento de poliolefina (libre de halógenos)',

const PARTE = {norma:['H', 'ES'], tension:['05', '07'], aisl:['V·a', 'Z1·a'], cub:['V·c', 'Z1·c'], flex:['-K', '-F']};

const PLANTILLAS = [

  {norma:'ES', tension:'07', aisl:'Z1·a', flex:'-K', as:true, uni:true},             // ES07Z1-K (AS) 1×s

const letra = x => x.split('·')[0];
function dni(p) {

  const comp = t.uni ? `1×${es(s)}` : `${n}G${es(s)}`;
  const codigo = `${t.norma}${t.tension}${letra(t.aisl)}${t.cub ? letra(t.cub) : ''}${t.flex}${t.as ? ' (AS)' : ''} ${comp} mm²`;
  const calcs = [];
  const pregunta = (k, cod, parte) => {
    const otros = Object.keys(SIG).filter(x => x !== cod && !(parte === 'aisl' && (x === 'V·c' || x === 'Z1·c')) && !(parte === 'cub' && (x === 'V·a' || x === 'Z1·a')));   // la misma letra en la otra posición confundiría

  const frase = `${SIG[t.norma]}, de ${SIG[t.tension].replace('Tensión ', '')}, ${SIG[t.aisl].toLowerCase()}${t.cub ? ' y ' + SIG[t.cub].toLowerCase() : ''}, ${SIG[t.flex].toLowerCase()}${t.as ? ', libre de halógenos' : ''}, con ${ok.toLowerCase()}.`;

// ---------- intensidad máxima (tabla) ----------

}

function teoria(p) {

}

  const l = []; for (let i = 0; i < 3; i++) l.push(hacer(orden[i % orden.length]));

const textoPlano = (s, j) => fs(s.replace(/\{(\w+)\}/g, (_, k) => j.toks[k].v));
// ---------- examen ----------
let E = null;
const pideE = j => j.calc.filter(c => c.pide && !c.elige && c.k !== 'comp');

const pideO = j => { j.exO = j.exO || j.calc.filter(c => c.elige && c.pide).map(c => ({c, ops:shuffle([c.ok, ...c.malas])})); return j.exO; };

function leeE() { E.val = $$('[id^=ex]').map(i => i.value); }
function clicE(a, el) {
  if (el.dataset.eo) { leeE(); const [k, i] = el.dataset.eo.split('|').map(Number); E.sel = E.sel || {}; E.sel[k] = i; SND.clic(); return rondaE(); }

  if (a === 'e:ok') { leeE(); const j = E.l[E.i], pide = pideE(j), ops = pideO(j), sel = E.sel || {};

   <div class="r-row" style="justify-content:center"><button type="button" class="r-b pri big" data-a="menu">Volver al menú</button></div></article>`);
}
